models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: order_status
        data_tests:
          - accepted_values:
              arguments: # available in v1.10.5 and higher. Older versions can set the <argument_name> as the top-level property.
                values: ['delivered','invoiced','shipped','processing','unavailable','canceled','created','approved']
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
  
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: stg_order_items
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
                
  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests:
          - not_null
          - unique
          